on: [push, pull_request]

jobs:
  python-compat:
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
        resolution: ["lowest-direct", "highest"]
    uses: ./.github/workflows/_run_tests.yml
    with:
      python-version: ${{ matrix.python-version }}
      resolution: ${{ matrix.resolution }}
      extra: "all"

  extras-isolation:
    strategy:
      matrix:
        extra: ["tpot", "all"]
    uses: ./.github/workflows/_run_tests.yml
    with:
      python-version: "3.14"
      resolution: "highest"
      extra: ${{ matrix.extra }}
