[project]
name = "liger"
version = "0.12.0"
description = "Helper functions for the Likert General Regressor project"
authors = [
    {name = "Chris Reeves",email = "reeves.chris.allan@gmail.com"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dill (>=0.3.9,<0.4.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "numpy (>=1.26.4,<3.0.0)",
    "openai (>=1.61.1,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "scikit-learn (>=1.4.2,<2.0.0)",
    "sentence-transformers (>=3.4.1,<4.0.0)",
    "tpot (>=1.0.0,<2.0.0)",
    "tiktoken (>=0.9.0,<0.10.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "torch (>=2.9.1,<3.0.0)"
]


[project.scripts]
lg-tpot = "liger.tpot.run_segment:main"


[project.urls]
Repository = "https://github.com/reevesc7/liger.git"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
