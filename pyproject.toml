[project]
name = "liger"
version = "0.13.0"
description = "Helper functions for the Likert General Regressor project"
authors = [{ name = "Chris Reeves", email = "reeves.chris.allan@gmail.com" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "matplotlib (>=3.10.0,<4.0.0)",
    "numpy (>=1.26.4,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "scikit-learn (>=1.4.2,<2.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
]

[project.optional-dependencies]
embedding = [
    "openai (>=1.61.1,<2.0.0)",
    "sentence-transformers (>=3.4.1,<4.0.0)",
    "torch (>=2.9.1,<3.0.0)",
]
surveying = [
    "openai (>=1.61.1,<2.0.0)",
    "tiktoken (>=0.9.0,<0.10.0)",
]
tpot = [
    "dill (>=0.3.9,<0.4.0)",
    "tpot (>=1.0.0,<2.0.0)",
]
all = [
    "liger[embedding]",
    "liger[surveying]",
    "liger[tpot]",
]

[project.urls]
Repository = "https://github.com/reevesc7/liger.git"

[project.scripts]
lg-tpot = "liger.tpot.run_segment:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
