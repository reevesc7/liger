[project]
name = "liger"
description = "Helper functions for the Likert General Regressor project"
authors = [{ name = "Chris Reeves", email = "reeves.chris.allan@gmail.com" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "matplotlib (>=3.10.0,<4.0.0)",
    "numpy (>=1.26.4,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "scikit-learn (>=1.4.2,<2.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "simpleeval (>=1.0.7,<2.0.0)",
]

[project.optional-dependencies]
embedding = [
    "openai (>=1.61.1,<2.0.0)",
    "sentence-transformers (>=3.4.1,<4.0.0)",
    "torch (>=2.9.1,<3.0.0)",
]
surveying = [
    "openai (>=1.61.1,<2.0.0)",
    "tiktoken (>=0.9.0,<0.10.0)",
]
tpot = [
    "dill (>=0.3.9,<0.4.0)",
    "tpot (>=1.0.0,<2.0.0)",
]
all = [
    "liger[embedding]",
    "liger[surveying]",
    "liger[tpot]",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/reevesc7/liger.git"

[project.scripts]
liger = "liger:cmd_liger"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
search_parent_directories = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slurm: requires Slurm or vslurm to be within scope and active",
]
filterwarnings = ["ignore::UserWarning"]
